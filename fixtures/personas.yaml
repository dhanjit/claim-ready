# Claim Ready — synthetic member personas
# ALL DATA SYNTHETIC AND VISIBLY FAKE: UANs start 9999 (12-digit), Aadhaar held only as a
# masked display ref, IFSC uses the reserved-looking "TEST" bank code, mobiles are 90000000xx.
# Never add real identifiers here — hackathon hard rule, see CLAUDE.md.
# expected_findings drive the one-test-per-rule suite: every rule id must appear at least once.

personas:
  - id: clean-asha
    label: "Asha — everything green"
    story: >
      Asha Borgohain, 31, Guwahati. One employer, clean KYC. Files a ₹60,000 illness advance
      (mother's surgery) and it should sail through.
    expected_findings: []
    claim: { type: form31_68J, amount_requested: 60000, purpose: "Mother's surgery" }
    record:
      uan: { number: "999900000001", name: "Asha Borgohain", dob: "1995-03-14", mobile: "9000000001", aadhaarLinked: true, panLinked: true }
      serviceHistory:
        - { establishment: "Brahmaputra Textiles Pvt Ltd", memberId: "GHXYZ99990000000000001", joinDate: "2018-07-02", exitDate: null, exitMarked: false, current: true }
      kyc:
        aadhaar: { name: "Asha Borgohain", dob: "1995-03-14", maskedRef: "XXXX XXXX 0001", mobileLinked: true, verified: true }
        pan: { present: true, name: "Asha Borgohain" }
        bank: { accountName: "Asha Borgohain", maskedAccount: "XXXX0001", ifsc: "TEST0000001", seeded: true, jointAccount: false }
      balance: { employeeShare: 210000, employerShare: 64000, pensionShare: 89000, monthlyWage: 15000 }

